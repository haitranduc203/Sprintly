  .ot-results{display:grid;gap:8px}
  .ot-result{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:start;gap:9px;width:100%;background:#fff;border:1px solid #e6eae3;border-radius:14px;color:#151b14;text-align:left;padding:11px;font:inherit}
  .ot-result-icon{width:34px;height:34px}
  .ot-result-content{display:grid;gap:4px}
  .ot-result-content>strong{font-size:14px;line-height:1.3;font-weight:730}
  .ot-result-project{display:flex;gap:5px;align-items:center;color:#656b62;font-size:11px}
  .ot-result-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px}
  .ot-result-meta .pill{font-size:10px}
  .ot-result-date{color:#5f675b;font-size:11px;white-space:nowrap;gap:4px}
  .ot-result-date svg{width:13px;height:13px}
`;

const screens={...supporting,...taskScreens,overview,projects,members,calendar,board};
const screenList=[
  ['projects','Dự án','workspace'],['overview','Tổng quan','workspace',true],['calendar','Lịch công việc','workspace',true],
  ['members','Thành viên','workspace'],['board','Bảng Kanban','tasks'],['task','Chi tiết công việc','tasks'],
  ['task-form','Tạo / sửa công việc','tasks'],['search','Tìm và lọc','tasks'],['workspaces','Danh sách workspace','workspace'],
  ['login','Đăng nhập','account'],['register','Đăng ký','account'],['profile','Hồ sơ','account'],['session','Khôi phục phiên','account']
];
const groups=[['all','Tất cả'],['workspace','Workspace'],['tasks','Công việc'],['account','Tài khoản']];
const galleryRoot=document.getElementById('gallery');
const groupNav=document.getElementById('group-nav');
const sheet=document.getElementById('sheet');
const notice=document.getElementById('notice');
const selectedFrames=new Map();
let activeGroup='all';
let noticeTimer=0;
let previewTrigger=null;
let calendarWeek=0;
let calendarDay=1;

function frameBody(id,mode) {
  const screen=screens[id];
  return id==='task-form'?screen(mode||'create'):screen();
}

function renderGallery(){
  document.getElementById('design-brand').innerHTML=brand();
  document.getElementById('screen-css').textContent=supportingCss+'\n'+taskScreensCss;
  galleryRoot.innerHTML=screenList.map(([id,title,group,proposal])=>`<article id="${id}" class="frame" data-group="${group}" aria-labelledby="heading-${id}"><h2 class="frame-heading" id="heading-${id}"><a href="#${id}">${h(title)}</a>${proposal?'<small>Đề xuất</small>':''}</h2><div class="phone"><div class="device-status" aria-hidden="true"><span>9:41</span><span class="signals">${icon('reception')}${icon('wifi')}${icon('battery')}</span></div><div class="device-content">${frameBody(id)}</div><div class="gesture" aria-hidden="true"></div></div></article>`).join('');
  for(const frame of galleryRoot.querySelectorAll('.frame'))selectedFrames.set(frame.id,frame);
  groupNav.innerHTML=groups.map(([id,label])=>`<button type="button" data-group-filter="${id}" aria-pressed="false">${label}</button>`).join('');
  showGroup('all');
}

function showGroup(group){
  if(!groups.some(([id])=>id===group))return;
  activeGroup=group;
  let count=0;
  for(const frame of selectedFrames.values()){
    frame.hidden=group!=='all'&&frame.dataset.group!==group;
    if(!frame.hidden)count++;
  }
  groupNav.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.groupFilter===activeGroup)));
  document.getElementById('screen-count').textContent=`${count} màn hình`;
}

function navigate(id,trigger){
  const frame=selectedFrames.get(id);
  if(!frame)return;
  if(frame.hidden)showGroup(frame.dataset.group);
  if(id==='task-form'){
    const from=trigger?.closest('.frame')?.id;
    frame.querySelector('.device-content').innerHTML=frameBody(id,from==='task'?'edit':'create');
  }
  document.querySelector('.frame.recent')?.classList.remove('recent');
  frame.classList.add('recent');
  frame.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  frame.querySelector('.frame-heading a')?.focus({preventScroll:true});
}

function alertPreview(message){
  clearTimeout(noticeTimer);
  notice.innerHTML=`<span>${h(message)}</span>${iconbtn('close','Đóng thông báo','data-hide-notice')}`;
  notice.hidden=false;
  noticeTimer=setTimeout(()=>{notice.hidden=true;},3300);
}

const optionList=values=>values.map(value=>`<option>${h(value)}</option>`).join('');
const selectField=(label,options)=>`<label class="field"><span>${label}</span><select>${optionList(options)}</select></label>`;
const textArea=label=>`<label class="field"><span>${label}</span><textarea rows="3"></textarea></label>`;
const formSheet=(title,content,label='Lưu thay đổi',message='Đã xem thao tác lưu. Dữ liệu mẫu được giữ nguyên.')=>[title,`<div class="stack">${content}<div class="actions">${btn('Hủy','text','','data-close-sheet')}${btn(label,'primary','',`data-sheet-confirm="${h(message)}"`)}</div></div>`];
const confirmSheet=(title,copy,label)=>[title,`<div class="stack"><p>${h(copy)}</p><div class="actions">${btn('Hủy','text','','data-close-sheet')}${btn(label,'danger','', 'data-sheet-confirm="Đã xem thao tác xác nhận."')}</div></div>`];
const actionSheet=(title,actions)=>[title,`<div class="stack">${actions.map(([label,glyph,target,style='secondary'])=>btn(label,style,glyph,target)).join('')}</div>`];
const plainField=(label,value='')=>field(label,{value});

const dialogs={
  workspace:()=>formSheet('Tạo workspace',plainField('Tên workspace')+textArea('Mô tả (tùy chọn)'),'Tạo workspace'),
  'workspace-edit':()=>formSheet('Sửa workspace',plainField('Tên workspace','Studio Sprintly')+textArea('Mô tả (tùy chọn)')),
  'workspace-delete':()=>confirmSheet('Xóa workspace?','Studio Sprintly cùng các dự án, công việc và lịch sử liên quan sẽ bị xóa.','Xóa workspace'),
  'workspace-actions':()=>actionSheet('Thao tác workspace',[['Sửa workspace','edit','data-dialog="workspace-edit"'],['Xóa workspace','trash','data-dialog="workspace-delete"','danger']]),
  project:()=>formSheet('Tạo dự án',plainField('Tên dự án')+textArea('Mô tả (tùy chọn)'),'Tạo dự án'),
  'project-edit':()=>formSheet('Sửa dự án',plainField('Tên dự án','Android App')+textArea('Mô tả (tùy chọn)')),
  'project-delete':()=>confirmSheet('Xóa dự án?','Các cột, công việc, bình luận và lịch sử của Android App sẽ bị xóa.','Xóa dự án'),
  'project-summary':trigger=>actionSheet(trigger.dataset.project||'Dự án',[['Xem bảng mẫu','board','data-go="board"'],['Sửa dự án','edit','data-dialog="project-edit"']]),
  member:()=>['Thêm thành viên',`<div class="stack">${field('Email tài khoản Sprintly',{type:'email',placeholder:'Email chính xác'})}${btn('Tìm tài khoản','secondary','search','data-lookup')}<div class="caption" data-lookup-result role="status"></div></div>`],
  'member-actions':trigger=>actionSheet(names[trigger.dataset.person]||'Thành viên',[['Gỡ thành viên','users',`data-dialog="member-remove" data-person="${h(trigger.dataset.person||'QK')}"`,'danger']]),
  'member-remove':trigger=>confirmSheet('Gỡ thành viên?',`${names[trigger.dataset.person]||'Thành viên'} sẽ mất quyền truy cập. Các task được giao sẽ chuyển về chưa phân công.`,'Gỡ thành viên'),
  'board-actions':()=>actionSheet('Thao tác bảng',[['Thêm cột','plus','data-dialog="column"'],['Sửa dự án','edit','data-dialog="project-edit"'],['Xóa dự án','trash','data-dialog="project-delete"','danger']]),
  column:()=>formSheet('Thêm cột',plainField('Tên cột'),'Thêm cột'),
  'column-edit':()=>formSheet('Đổi tên cột',plainField('Tên cột','In Progress')),
  'column-actions':()=>actionSheet('Thao tác cột',[['Tạo công việc','plus','data-go="task-form"'],['Đổi tên cột','edit','data-dialog="column-edit"']]),
  'task-actions':()=>actionSheet('Thao tác công việc',[['Di chuyển','move','data-dialog="move"'],['Chỉnh sửa','edit','data-go="task-form"'],['Xóa công việc','trash','data-dialog="task-delete"','danger']]),
  'task-delete':()=>confirmSheet('Xóa công việc?','Bình luận và lịch sử của công việc này sẽ bị xóa.','Xóa công việc'),
  filters:()=>formSheet('Bộ lọc công việc',selectField('Cột',['Tất cả cột','To Do','In Progress','Done'])+selectField('Ưu tiên',['Tất cả mức','Khẩn cấp','Cao','Trung bình','Thấp'])+selectField('Người phụ trách',['Tất cả thành viên',...Object.values(names)]),'Áp dụng','Đã xem thao tác áp dụng bộ lọc.'),
  move:()=>formSheet('Di chuyển công việc',selectField('Cột đích',['To Do','In Progress','Done'])+selectField('Vị trí',['Đầu cột','Cuối cột']),'Di chuyển','Đã xem thao tác di chuyển.'),
  comment:()=>formSheet('Viết bình luận',textArea('Nội dung'),'Gửi','Đã xem thao tác gửi bình luận.')
};

function openDialog(key,trigger){
  if(!Object.hasOwn(dialogs,key))return;
  if(!sheet.open)previewTrigger=trigger;
  const [title,content]=dialogs[key](trigger);
  sheet.innerHTML=`<header class="sheet-head"><h2 id="sheet-heading">${h(title)}</h2>${iconbtn('close','Đóng','data-close-sheet')}</header>${content}`;
  if(!sheet.open)sheet.showModal();
  sheet.querySelector('input,select,textarea')?.focus();
}

function updateWeek(){
  const frame=selectedFrames.get('calendar');
  const start=new Date(Date.UTC(2026,10,16+calendarWeek*7));
  const end=new Date(Date.UTC(2026,10,22+calendarWeek*7));
  const formatter=new Intl.DateTimeFormat('vi-VN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  frame.querySelector('[data-week-label]').textContent=calendarWeek===0?'16–22 tháng 11, 2026':`${formatter.format(start)} – ${formatter.format(end)}`;
  frame.querySelectorAll('[data-week-day]').forEach((button,i)=>{
    const day=new Date(Date.UTC(2026,10,16+calendarWeek*7+i));
    button.querySelector('strong').textContent=String(day.getUTCDate());
    button.setAttribute('aria-pressed',String(i===calendarDay));
  });
  const track=frame.querySelector('.week-track');
  track.style.setProperty('--day-position',`${(calendarDay+.5)*100/7}%`);
  track.querySelectorAll('.event').forEach(button=>{button.hidden=calendarWeek!==0;});
  let empty=track.querySelector('.week-empty');
  if(!empty){empty=document.createElement('p');empty.className='week-empty caption';empty.textContent='Không có công việc đến hạn trong tuần này.';track.append(empty);}
  empty.hidden=calendarWeek===0;
}

function updateSearch(input){
  const frame=selectedFrames.get('search');
  const keyword=input.value.trim().toLocaleLowerCase('vi');
  const rows=Array.from(frame.querySelectorAll('[data-task-id]'));
  let shown=0;
  for(const row of rows){row.hidden=Boolean(keyword&&!row.textContent.toLocaleLowerCase('vi').includes(keyword));if(!row.hidden)shown++;}
  const count=frame.querySelector('[data-task-search-count]');
  if(count)count.textContent=`${shown} công việc`;
  const results=frame.querySelector('[data-task-search-results]');
  let empty=results.querySelector('.search-empty');
  if(!empty){empty=document.createElement('p');empty.className='search-empty caption';empty.textContent='Không có kết quả phù hợp.';results.append(empty);}
  empty.hidden=shown>0;
}

document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button)return;
  if(button.dataset.groupFilter){showGroup(button.dataset.groupFilter);return;}
  if(button.dataset.dialog){openDialog(button.dataset.dialog,button);return;}
  if(button.hasAttribute('data-close-sheet')){sheet.close();return;}
  if(button.dataset.sheetConfirm){sheet.close();alertPreview(button.dataset.sheetConfirm);return;}
  if(button.hasAttribute('data-lookup')){
    const email=sheet.querySelector('input[type=email]');
    sheet.querySelector('[data-lookup-result]').textContent=email.value.trim()&&email.validity.valid?'Tra cứu qua API khi triển khai.':'Nhập email hợp lệ để tìm tài khoản.';
    return;
  }
  if(button.dataset.go){if(sheet.open)sheet.close();navigate(button.dataset.go,button);return;}
  if(button.dataset.weekStep!==undefined){calendarWeek+=Number(button.dataset.weekStep);updateWeek();return;}
  if(button.hasAttribute('data-week-today')){calendarWeek=0;calendarDay=1;updateWeek();return;}
  if(button.dataset.weekDay!==undefined){calendarDay=Number(button.dataset.weekDay);updateWeek();return;}
  if(button.dataset.colJump){
    const board=selectedFrames.get('board');
    board.querySelector(`[data-column="${button.dataset.colJump}"]`)?.scrollIntoView({block:'nearest',inline:'start',behavior:'smooth'});
    board.querySelectorAll('[data-col-jump]').forEach(chip=>chip.setAttribute('aria-pressed',String(chip===button)));
    return;
  }
  if(button.hasAttribute('data-password')){
    const input=button.parentElement.querySelector('input');
    const show=input.type==='password';
    input.type=show?'text':'password';
    button.setAttribute('aria-pressed',String(show));
    button.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');
    return;
  }
  if(button.hasAttribute('data-hide-notice')){notice.hidden=true;return;}
});

document.addEventListener('input',event=>{if(event.target.hasAttribute('data-task-search'))updateSearch(event.target);});
sheet.addEventListener('close',()=>{if(previewTrigger?.isConnected)previewTrigger.focus({preventScroll:true});previewTrigger=null;});
renderGallery();
if(location.hash)selectedFrames.get(location.hash.slice(1))?.scrollIntoView({block:'start'});
</script>
</body>
